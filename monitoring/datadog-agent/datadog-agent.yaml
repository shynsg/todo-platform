kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
spec:
  global:
    clusterName: "k3s-vps-learning"
    site: "us5.datadoghq.com"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
    tags:
      - "env:prod"
    kubernetesResourcesLabelsAsTags:
      pods:
        app: service
        app.kubernetes.io/name: service
      deployments.apps:
        app: service
        app.kubernetes.io/name: service
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: "default-target"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
            ddTraceConfigs:
              - name: "DD_RUM_ENABLED"
                value: "true"
              - name: "DD_RUM_APPLICATION_ID"
                value: "a1432b80-8baf-4e21-9572-61360e5ed6de"
              - name: "DD_RUM_CLIENT_TOKEN"
                value: "pubca550527baba8b28bc73e591d12898a1"
              - name: "DD_RUM_REMOTE_CONFIGURATION_ID"
                value: "128cd03d-c59f-4625-93ec-0e23cbfb21a9"
              - name: "DD_RUM_SITE"
                value: "us5.datadoghq.com"
    logCollection:
      enabled: true
      containerCollectAll: true
    otelCollector:
      enabled: true
      ports:
        - containerPort: 4317
          hostPort: 4317
          name: "otel-grpc"
        - containerPort: 4318
          hostPort: 4318
          name: "otel-http"
    autoscaling:
      workload:
        enabled: true
    eventCollection:
      unbundleEvents: true
