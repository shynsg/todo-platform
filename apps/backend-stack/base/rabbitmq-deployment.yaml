apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      annotations:
        admission.datadoghq.com/enabled: "false"
      labels:
        app: rabbitmq
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: Always
      initContainers:
        - name: rabbitmq-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              printf '%s' 'todo-learning-cookie' > /var/lib/rabbitmq/.erlang.cookie
              chown -R 999:999 /var/lib/rabbitmq
              chmod 700 /var/lib/rabbitmq
              chmod 400 /var/lib/rabbitmq/.erlang.cookie
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          envFrom:
            - secretRef:
                name: rabbitmq-secret
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          startupProbe:
            tcpSocket:
              port: amqp
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: rabbitmq-data
          emptyDir: {}
