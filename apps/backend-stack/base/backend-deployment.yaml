apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: todo-backend
    tags.datadoghq.com/env: prod
    tags.datadoghq.com/service: todo-backend
    tags.datadoghq.com/version: v0.0.3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        admission.datadoghq.com/enabled: "true"
        admission.datadoghq.com/js-lib.version: "5"
      labels:
        app: backend
        app.kubernetes.io/name: todo-backend
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: todo-backend
        tags.datadoghq.com/version: v0.0.3
    spec:
      containers:
        - name: backend
          image: ghcr.io/shynsg/todo-backend:v0.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: DD_SERVICE
              value: todo-backend
            - name: DD_ENV
              value: prod
            - name: DD_VERSION
              value: v0.0.3
            - name: DD_LOGS_INJECTION
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
